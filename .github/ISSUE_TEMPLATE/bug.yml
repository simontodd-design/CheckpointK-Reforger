name: Bug report
description: Something is broken or not working as expected
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - CK Core (backend)
        - CK Manager (admin UI)
        - CK Launcher
        - Reforger Mod (in-game)
        - Manager Agent
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Plain-English description of the bug
      placeholder: When I tried to X, Y happened instead of Z
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CK version / commit
      description: Find in CK Manager footer or `git rev-parse HEAD`
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / Sentry link
      description: Paste a few lines or link a Sentry issue
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for duplicates
          required: true

version: 2
updates:
  # JS / TS packages — group minor & patch into single weekly PR
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Tauri / Rust side of the launcher
  - package-ecosystem: "cargo"
    directory: "/launcher/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Docker images
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"

name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration:
    name: Vitest (unit + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ck
          POSTGRES_PASSWORD: ck
          POSTGRES_DB: ck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (for manager browser tests)
        run: cd manager && bunx playwright install --with-deps chromium

      - name: Generate Drizzle migrations (idempotent — produces no diff if up to date)
        env:
          DATABASE_URL: postgres://ck:ck@localhost:5432/ck_test
        run: bun run db:generate

      - name: Run Drizzle migrations
        env:
          DATABASE_URL: postgres://ck:ck@localhost:5432/ck_test
        run: bun run db:migrate

      - name: Vitest
        env:
          DATABASE_URL: postgres://ck:ck@localhost:5432/ck_test
          REDIS_URL: redis://localhost:6379
        run: bun run test
